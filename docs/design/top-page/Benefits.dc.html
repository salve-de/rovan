<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">

<div style="width: 1440px; height: 860px; box-sizing: border-box; background: #f7faf8; padding: 84px 80px 64px; display: flex; flex-direction: column; align-items: center; gap: 44px;">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
    <span style="font-size: 15px; font-weight: 700; color: #147a52;">なぜ、Rovanなのか</span>
    <h2 style="margin: 0; font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 42px; line-height: 1.4; font-weight: 700; color: #102b43;">Rovanを使う、3つのメリット</h2>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; width: 100%;">
    <div style="background: #ffffff; border-radius: 20px; padding: 28px 30px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 28px rgba(16, 43, 67, 0.06);">
      <img src="/_blob/52ecd448d253282eb3adeebe71f1a02b" alt="パソコンでAIに質問する人" style="width: 200px; height: 200px; align-self: center;">
      <span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 44px; font-weight: 700; color: #9fddbf; line-height: 1;">01</span>
      <h3 style="margin: 0; font-size: 23px; font-weight: 700; color: #102b43;">AIが、御社のことを知る</h3>
      <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #475569;">AIは、ネットで確かめられる情報から会社を選びます。Rovanが御社の強みを、AIが読める形で公開します。</p>
    </div>
    <div style="background: #ffffff; border-radius: 20px; padding: 28px 30px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 28px rgba(16, 43, 67, 0.06);">
      <img src="/_blob/2b29d0ad1557b70ae946a3477f378094" alt="強みをひらめく社長" style="width: 200px; height: 200px; align-self: center;">
      <span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 44px; font-weight: 700; color: #9fddbf; line-height: 1;">02</span>
      <h3 style="margin: 0; font-size: 23px; font-weight: 700; color: #102b43;">大手と戦わずに、選ばれる</h3>
      <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #475569;">「単品1個から」「夜も相談できる」など、御社だけの強みが活きる質問で名前を出しにいきます。</p>
    </div>
    <div style="background: #ffffff; border-radius: 20px; padding: 28px 30px 32px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 8px 28px rgba(16, 43, 67, 0.06);">
      <img src="/_blob/303fb87cb5415fd61e8b5a47dc4ea776" alt="結果に喜ぶ社長" style="width: 200px; height: 200px; align-self: center;">
      <span style="font-family: 'Zen Kaku Gothic New', sans-serif; font-size: 44px; font-weight: 700; color: #9fddbf; line-height: 1;">03</span>
      <h3 style="margin: 0; font-size: 23px; font-weight: 700; color: #102b43;">手間なく、毎週よくしていく</h3>
      <p style="margin: 0; font-size: 16px; line-height: 1.8; color: #475569;">やるのは最初の2回だけ。あとは毎週AIに聞き直し、ページを最新に保って、結果をお知らせします。</p>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; gap: 18px; background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 16px; padding: 16px 28px; width: 100%; box-sizing: border-box;">

    <span style="color: #cbd5e1;">｜</span>
    <span style="font-size: 16px; color: #0f172a;">続けるなら <b style="font-size: 20px;">月10,780円</b>（税込）</span>
    <span style="color: #cbd5e1;">｜</span>
    <span style="font-size: 16px; color: #0f172a;">最初の14日間は無料・自動で課金されません</span>
  </div>
</div>
